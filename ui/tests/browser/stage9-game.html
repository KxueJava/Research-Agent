<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>阶段0游戏基线</title><style>body{margin:0;padding:16px;font:16px system-ui}button{padding:10px;margin:3px}canvas{display:block;width:min(100%,320px);background:#eaf5f0}</style><body><button id="start">开始游戏</button><button id="hit">命中目标</button><button id="reset">重新开始</button><output id="score">0</output><canvas id="field" width="320" height="180" aria-label="玩家与目标"></canvas><output id="position">20,90</output><nav aria-label="方向操作"><button data-key="ArrowLeft">向左</button><button data-key="ArrowUp">向上</button><button data-key="ArrowDown">向下</button><button data-key="ArrowRight">向右</button></nav><script>
window.probe={ticks:0,frames:0};let x=20,y=90,score=0,running=false;const canvas=document.querySelector('#field'),ctx=canvas.getContext('2d');
function draw(){ctx.clearRect(0,0,320,180);ctx.fillStyle='#145a4c';ctx.fillRect(x-6,y-6,12,12);ctx.fillStyle='#c93d32';ctx.beginPath();ctx.arc(270,90,9,0,Math.PI*2);ctx.fill();document.querySelector('#position').textContent=x+','+y;document.querySelector('#score').textContent=score;}
function move(key){if(!running)return;if(key==='ArrowLeft')x=Math.max(6,x-10);if(key==='ArrowRight')x=Math.min(314,x+10);if(key==='ArrowUp')y=Math.max(6,y-10);if(key==='ArrowDown')y=Math.min(174,y+10);draw();}
document.querySelector('#start').onclick=()=>running=true;document.querySelector('#hit').onclick=()=>{if(running){score++;draw()}};document.querySelector('#reset').onclick=()=>{x=20;y=90;score=0;running=false;draw()};document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>move(b.dataset.key));window.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){e.preventDefault();move(e.key)}});
setInterval(()=>probe.ticks++,20);function frame(){probe.frames++;requestAnimationFrame(frame)}requestAnimationFrame(frame);draw();
</script></body></html>
