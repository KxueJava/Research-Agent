<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>模型配置 · 重设计示例</title>
<style>
/* ============================================================
   Tokens —— 直接复用 ui/src/global.css 的 Kimi design-tokens v2，
   落地到工程时无需改动变量名。
   ============================================================ */
:root{
  --accent-primary:#1783ff;
  --color-bg:#ffffff;
  --color-surface:#fafbfc;
  --color-surface-raised:#ffffff;
  --color-surface-sunken:#f3f5f8;
  --color-text:rgba(0,0,0,.9);
  --color-text-muted:#6b7280;
  --color-text-faint:#9aa3af;
  --color-line:#e7eaee;
  --color-line-strong:#d4d9e0;
  --color-hover:#f1f3f5;
  --color-accent:#1783ff;
  --color-accent-hover:#0f6fe0;
  --color-accent-soft:#e8f3ff;
  --color-accent-bd:#cfe6ff;
  --color-success:#0e7a38;
  --color-success-soft:#e7f6ee;
  --color-danger:#c0392b;
  --color-danger-soft:#fbeaea;
  --color-warning:#a9610a;
  --color-warning-soft:#fbf1e0;
  --color-warning-bd:#f0d9b8;
  --color-text-on-accent:#ffffff;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --p-focus-ring:0 0 0 3px var(--color-accent-soft);
  --kimi-radius-sm:6px;
  --kimi-radius-md:8px;
  --radius-card:12px;
  --text-xs:12px; --text-sm:13px; --text-base:14px;
  --leading-tight:1.25; --leading-normal:1.5; --leading-relaxed:1.7;
  --font-ui:"Inter Variable","Inter","Instrument Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --shadow-card:0 1px 2px rgba(16,24,40,.04);
  --shadow-raise:0 4px 14px rgba(16,24,40,.08);
  --dur:.18s;
}
@media (prefers-color-scheme: dark){
  :root{
    --color-bg:#0d1117; --color-surface:#0d1117; --color-surface-raised:#161b22;
    --color-surface-sunken:#1c2128; --color-text:rgba(255,255,255,.92);
    --color-text-muted:#9aa0a8; --color-text-faint:#6e7681;
    --color-line:#2d333b; --color-line-strong:#3d444d; --color-hover:#21262d;
    --color-accent:#4d9dff; --color-accent-hover:#6fb0ff;
    --color-accent-soft:#132a45; --color-accent-bd:#1f4470;
    --color-success:#3fb950; --color-success-soft:#12261a;
    --color-danger:#f85149; --color-danger-soft:#2a1416;
    --color-warning:#d29922; --color-warning-soft:#2a2113;
    --shadow-card:0 1px 2px rgba(0,0,0,.4);
    --shadow-raise:0 4px 14px rgba(0,0,0,.5);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--color-surface);
  color:var(--color-text);
  font-family:var(--font-ui);
  font-size:var(--text-base);
  line-height:var(--leading-normal);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit}
svg{display:block;flex:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:where(button,a,input,select,[tabindex]):focus-visible{
  outline:2px solid var(--color-accent);
  outline-offset:2px;
  box-shadow:var(--p-focus-ring);
  border-radius:var(--kimi-radius-sm);
}

/* ============================ Top bar ============================ */
.topbar{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb, var(--color-bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--color-line);
}
.topbar-inner{
  max-width:1340px; margin:0 auto;
  padding:10px 24px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:34px;height:34px;border-radius:10px;flex:none;
  display:grid;place-items:center;
  background:var(--color-accent-soft); color:var(--color-accent);
  border:1px solid var(--color-accent-bd);
}
.brand{flex:0 1 auto}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-title{font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.brand-sub{font-size:var(--text-xs);color:var(--color-text-muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1 1 auto;min-width:8px}
.tools{display:flex;align-items:center;gap:2px}

.icon-btn{
  width:36px;height:36px;flex:none;
  display:grid;place-items:center;
  border:1px solid transparent;border-radius:9px;
  background:transparent;color:var(--color-text-muted);
  cursor:pointer;
  transition:background var(--dur),color var(--dur),border-color var(--dur);
}
.icon-btn:hover{background:var(--color-hover);color:var(--color-text)}
.icon-btn[data-danger]:hover{background:var(--color-danger-soft);color:var(--color-danger)}
.icon-btn:disabled{opacity:.45;cursor:not-allowed}

/* 分段服务商筛选：借鉴 CC Switch 顶部图标 tab，但补上文字标签
   （icon-only 导航会损害可发现性） */
.seg{
  display:flex;align-items:center;gap:2px;padding:3px;
  background:var(--color-surface-sunken);
  border:1px solid var(--color-line);
  border-radius:11px;
  overflow-x:auto;scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.seg-btn{
  height:30px;padding:0 10px;flex:none;
  display:inline-flex;align-items:center;gap:6px;
  border:0;border-radius:8px;background:transparent;
  color:var(--color-text-muted);font-size:12.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;
  transition:background var(--dur),color var(--dur),box-shadow var(--dur);
}
.seg-btn:hover{color:var(--color-text)}
.seg-btn[aria-selected="true"]{
  background:var(--color-surface-raised);color:var(--color-text);
  box-shadow:var(--shadow-card);
}
.seg-btn .mark{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}

.btn{
  height:38px;padding:0 14px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:10px;border:1px solid transparent;
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:background var(--dur),border-color var(--dur),color var(--dur),opacity var(--dur);
}
.btn-primary{background:var(--color-accent);color:var(--color-text-on-accent)}
.btn-primary:hover{background:var(--color-accent-hover)}
.btn-outline{background:var(--color-surface-raised);border-color:var(--color-line-strong);color:var(--color-text)}
.btn-outline:hover{background:var(--color-hover)}
.btn-ghost{background:transparent;color:var(--color-text-muted)}
.btn-ghost:hover{background:var(--color-hover);color:var(--color-text)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 窄屏：品牌 + 主按钮一行，工具组 + 服务商 tab 一行，避免 4 行堆叠 */
@media (max-width:760px){
  .topbar-inner{padding:10px 14px;row-gap:10px}
  .brand{order:1}
  .spacer{display:none}
  #btnAdd{order:2;margin-left:auto}
  .tools{order:3}
  .seg{order:4;flex:1 1 150px;min-width:0}
}

/* ============================ Layout ============================ */
.body{max-width:1340px;margin:0 auto;padding:20px 24px 64px}
.workbench{display:grid;grid-template-columns:minmax(320px,392px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1040px){ .workbench{grid-template-columns:1fr} }

.panel{
  background:var(--color-surface-raised);
  border:1px solid var(--color-line);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);
}
.panel-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--color-line);
}
.panel-title{font-size:13.5px;font-weight:700;letter-spacing:-.005em}
.panel-sub{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:1px}
.panel-body{padding:16px}
.panel-foot{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 16px;border-top:1px solid var(--color-line);
  background:var(--color-surface-sunken);
  border-radius:0 0 var(--radius-card) var(--radius-card);
}

/* ============================ Rail / list ============================ */
.rail{position:sticky;top:78px;display:flex;flex-direction:column;gap:12px}
@media (max-width:1040px){ .rail{position:static} }

.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--color-text-faint);pointer-events:none}
.search input{
  width:100%;height:38px;padding:0 12px 0 34px;
  border:1px solid var(--color-line);border-radius:10px;
  background:var(--color-surface-raised);color:var(--color-text);
  font-size:13px;
  transition:border-color var(--dur),box-shadow var(--dur);
}
.search input::placeholder{color:var(--color-text-faint)}
.search input:focus{border-color:var(--color-accent);outline:none;box-shadow:var(--p-focus-ring)}

.list{display:flex;flex-direction:column;gap:10px;max-height:calc(100dvh - 300px);overflow-y:auto;padding:2px}
@media (max-width:1040px){ .list{max-height:none} }

/* 卡片：借鉴 CC Switch 的「拖拽手柄 + 图标 + 名称 + 链接」结构 */
.card{
  position:relative;
  display:flex;align-items:flex-start;gap:11px;
  padding:13px 12px 13px 6px;
  background:var(--color-surface-raised);
  border:1px solid var(--color-line);
  border-radius:var(--radius-card);
  cursor:pointer;
  transition:background var(--dur),border-color var(--dur),box-shadow var(--dur),transform var(--dur);
}
.card:hover{border-color:var(--color-line-strong);box-shadow:var(--shadow-raise)}
.card[aria-selected="true"]{
  background:var(--color-accent-soft);
  border-color:var(--color-accent-bd);
  box-shadow:0 0 0 1px var(--color-accent-bd);
}
.card[data-dragging]{opacity:.5;cursor:grabbing}
.card[data-dropzone]{border-color:var(--color-accent);border-style:dashed}

.grip{
  width:22px;align-self:stretch;flex:none;
  display:grid;place-items:center;
  border:0;background:transparent;color:var(--color-text-faint);
  cursor:grab;border-radius:var(--kimi-radius-sm);
  transition:color var(--dur),background var(--dur);
}
.grip:hover{color:var(--color-text-muted);background:color-mix(in srgb,var(--color-hover) 70%,transparent)}
.grip:active{cursor:grabbing}

.mark{
  width:34px;height:34px;flex:none;border-radius:9px;
  display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#fff;letter-spacing:-.02em;
  border:1px solid rgba(0,0,0,.06);
}
.card-main{min-width:0;flex:1}
.card-top{display:flex;align-items:center;gap:7px;min-width:0}
.card-name{
  font-size:14px;font-weight:600;letter-spacing:-.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot-on{background:var(--color-success)}
.dot-off{background:var(--color-text-faint)}
.card-url{
  display:block;margin-top:3px;
  font-family:var(--font-mono);font-size:11.5px;
  color:var(--color-accent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  overflow-wrap:anywhere;
  text-decoration:none;
}
.card-url:hover{text-decoration:underline}
.card-meta{
  display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;
  margin-top:7px;font-size:11.5px;color:var(--color-text-muted);
}
.card-meta .m{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}

.tag{
  display:inline-flex;align-items:center;gap:4px;
  height:19px;padding:0 7px;border-radius:999px;
  font-size:10.5px;font-weight:600;letter-spacing:.01em;
  background:var(--color-surface-sunken);color:var(--color-text-muted);
  border:1px solid var(--color-line);
  white-space:nowrap;
}
.tag-accent{background:var(--color-accent-soft);color:var(--color-accent);border-color:var(--color-accent-bd)}
.tag-warn{background:var(--color-warning-soft);color:var(--color-warning);border-color:var(--color-warning-bd)}

.card-actions{display:flex;align-items:center;gap:2px;flex:none}
.card-actions .icon-btn{width:30px;height:30px;border-radius:8px}
.card-actions .icon-btn:hover{background:color-mix(in srgb,var(--color-surface-raised) 60%,var(--color-hover))}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{
  padding:40px 20px;text-align:center;
  border:1px dashed var(--color-line-strong);
  border-radius:var(--radius-card);
  color:var(--color-text-muted);font-size:13px;
  background:var(--color-surface);
}
.empty b{display:block;color:var(--color-text);font-size:13.5px;margin-bottom:4px}

/* ============================ Form ============================ */
.section + .section{margin-top:20px;padding-top:18px;border-top:1px solid var(--color-line)}
.section-title{
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--color-text-faint);margin-bottom:12px;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
@media (max-width:720px){ .grid{grid-template-columns:1fr} }
.col-2{grid-column:1 / -1}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field-label{font-size:12.5px;font-weight:600;color:var(--color-text)}
.field-label .req{color:var(--color-danger);margin-left:2px}
.field-hint{font-size:11.5px;color:var(--color-text-muted);line-height:1.45}
.input,.select{
  width:100%;height:38px;padding:0 11px;
  border:1px solid var(--color-line);border-radius:9px;
  background:var(--color-surface-raised);color:var(--color-text);
  font-size:13px;
  transition:border-color var(--dur),box-shadow var(--dur),background var(--dur);
}
.input.mono{font-family:var(--font-mono);font-size:12.5px}
.input::placeholder{color:var(--color-text-faint)}
.input:focus,.select:focus{border-color:var(--color-accent);outline:none;box-shadow:var(--p-focus-ring)}
.input[readonly],.select:disabled{
  background:var(--color-surface-sunken);color:var(--color-text-muted);cursor:default;
}
.input-wrap{position:relative}
.input-wrap .input{padding-right:38px}
.input-wrap .icon-btn{position:absolute;right:2px;top:1px;width:34px;height:36px}
.select{appearance:none;padding-right:32px;cursor:pointer;background-image:none}
.select-wrap{position:relative}
.select-wrap > svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--color-text-faint);pointer-events:none}

.callout{
  display:flex;align-items:flex-start;gap:8px;
  margin-top:12px;padding:10px 12px;
  border-radius:9px;font-size:12.5px;line-height:1.5;
  background:var(--color-accent-soft);color:var(--color-text);
  border:1px solid var(--color-accent-bd);
}
.callout svg{color:var(--color-accent);margin-top:1px}

.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-size:13px;padding:6px 0}
.switch input{position:absolute;opacity:0;width:0;height:0}
.track{
  width:38px;height:22px;border-radius:999px;flex:none;
  background:var(--color-line-strong);position:relative;
  transition:background var(--dur);
}
.track::after{
  content:"";position:absolute;top:2px;left:2px;
  width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(16,24,40,.28);
  transition:transform var(--dur);
}
.switch input:checked + .track{background:var(--color-accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{box-shadow:var(--p-focus-ring);outline:2px solid var(--color-accent);outline-offset:2px}

.check{display:inline-flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13px;padding:6px 0}
.check input{
  appearance:none;width:17px;height:17px;margin:1px 0 0;flex:none;
  border:1.5px solid var(--color-line-strong);border-radius:5px;
  background:var(--color-surface-raised);cursor:pointer;position:relative;
  transition:background var(--dur),border-color var(--dur);
}
.check input:checked{background:var(--color-accent);border-color:var(--color-accent)}
.check input:checked::after{
  content:"";position:absolute;left:5px;top:1.5px;
  width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg);
}
.check input:focus-visible{box-shadow:var(--p-focus-ring)}

.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  height:24px;padding:0 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;
  background:var(--color-success-soft);color:var(--color-success);
}
.status-pill[data-off]{background:var(--color-surface-sunken);color:var(--color-text-muted)}

.result{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.result-ok{color:var(--color-success)}
.result-err{color:var(--color-danger);font-weight:500;min-width:0}

/* ============================ Modal ============================ */
.scrim{
  position:fixed;inset:0;z-index:100;
  background:rgba(16,24,40,.45);
  backdrop-filter:blur(2px);
  display:grid;place-items:center;padding:20px;
  animation:fade var(--dur) ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;
  background:var(--color-surface-raised);
  border:1px solid var(--color-line);
  border-radius:14px;
  box-shadow:0 20px 48px rgba(16,24,40,.22);
  animation:pop var(--dur) cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--color-line)}
.modal-title{font-size:15px;font-weight:700;flex:1}
.modal-body{padding:18px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--color-line);background:var(--color-surface-sunken);border-radius:0 0 14px 14px}

/* ============================ Toast ============================ */
.toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(360px,calc(100vw - 40px))}
.toast{
  display:flex;align-items:flex-start;gap:9px;
  padding:11px 13px;border-radius:10px;
  background:var(--color-surface-raised);
  border:1px solid var(--color-line);
  box-shadow:var(--shadow-raise);
  font-size:13px;
  animation:slide .22s cubic-bezier(.2,.9,.3,1);
}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast svg{margin-top:1px}
.toast-ok svg{color:var(--color-success)}
.toast-err svg{color:var(--color-danger)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<!-- ============================ 顶栏 ============================ -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="5" width="14" height="14" rx="2.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/>
          <path d="M9 2.5v2.5M15 2.5v2.5M9 19v2.5M15 19v2.5M2.5 9H5M2.5 15H5M19 9h2.5M19 15h2.5"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">模型配置</span>
        <span class="brand-sub" id="brandSub">接入用于 Agent 推理的大语言模型</span>
      </span>
    </div>

    <span class="spacer"></span>

    <div class="tools">
    <button class="icon-btn" type="button" id="btnRefresh" title="刷新列表" aria-label="刷新模型列表">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v5h-5"/>
      </svg>
    </button>
    <button class="icon-btn" type="button" id="btnImport" title="导入配置" aria-label="从 JSON 导入模型配置">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">

function bindList(){
  const list = document.getElementById("list");

  list.querySelectorAll(".card").forEach(card => {
    const id = Number(card.dataset.id);
    card.addEventListener("click", e => {
      if (e.target.closest('[data-stop], .card-actions')) return;
      select(id);
    });
    card.addEventListener("keydown", e => {
      if (e.target !== card) return;
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); select(id); }
      // 拖拽的键盘替代方案（WCAG: dragging-alternative）
      if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")){
        e.preventDefault();
        move(id, e.key === "ArrowUp" ? -1 : 1);
      }
    });
  });

  list.querySelectorAll("[data-act='test']").forEach(b =>
    b.addEventListener("click", e => { e.stopPropagation(); testById(Number(b.dataset.id), b); }));
  list.querySelectorAll("[data-act='del']").forEach(b =>
    b.addEventListener("click", e => { e.stopPropagation(); confirmDelete(Number(b.dataset.id)); }));

  // HTML5 拖拽排序
  let dragId = null;
  list.querySelectorAll(".card").forEach(card => {
    card.addEventListener("dragstart", e => {
      dragId = Number(card.dataset.id);
      card.dataset.dragging = "1";
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", String(dragId)); } catch {}
    });
    card.addEventListener("dragend", () => {
      delete card.dataset.dragging;
      list.querySelectorAll(".card").forEach(c => delete c.dataset.dropzone);
    });
    card.addEventListener("dragover", e => {
      if (dragId == null || Number(card.dataset.id) === dragId) return;
      e.preventDefault();
      list.querySelectorAll(".card").forEach(c => delete c.dataset.dropzone);
      card.dataset.dropzone = "1";
    });
    card.addEventListener("drop", e => {
      e.preventDefault();
      const targetId = Number(card.dataset.id);
      if (dragId == null || targetId === dragId) return;
      reorder(dragId, targetId);
      dragId = null;
    });
  });
}

function select(id){ state.selectedId = id; state.draft = null; state.dirty = false; renderAll(); }
function move(id, delta){
  const i = MODELS.findIndex(m => m.id === id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= MODELS.length) return;
  const [it] = MODELS.splice(i, 1); MODELS.splice(j, 0, it);
  renderList(); toast("已调整顺序");
}
function reorder(fromId, toId){
  const i = MODELS.findIndex(m => m.id === fromId);
  const j = MODELS.findIndex(m => m.id === toId);
  if (i < 0 || j < 0) return;
  const [it] = MODELS.splice(i, 1); MODELS.splice(j, 0, it);
  renderList(); toast("已调整顺序");
}

  const box = document.getElementById("detail");

  // 表单字段 → draft
  box.querySelectorAll("[data-k]").forEach(el => {
    const handler = () => {
      const m = current(); if (!m) return;
      const d = Object.assign({}, state.draft || m);
      const k = el.dataset.k;
      if (el.type === "checkbox") d[k] = el.checked ? (k === "isFallback" ? true : 1) : (k === "isFallback" ? false : 0);
      else if (k === "contextWindow") d[k] = el.value.trim() === "" ? null : (Number(el.value) || null);
      else d[k] = el.value;

      if (k === "isFallback") d.modelUsage = el.checked ? "fallback" : "default";
      if (k === "providerId"){
        const p = providerOf(el.value);
        if (p.baseUrl){ d.baseUrl = p.baseUrl; }
        d.completionsPath = p.completionsPath;
        if (k === "providerId" && el.value === "custom" && !d.baseUrl) d.baseUrl = "";
      }
      if (k === "modelName" && !d.modelId) d.modelId = el.value;

      state.draft = d; state.dirty = true;
      // 切换服务商 / 启用状态需要重绘以更新只读态与 pill
      if (k === "providerId" || k === "status") renderDetail();
      else {
        const save = document.getElementById("btnSave");
        const revert = document.getElementById("btnRevert");
        if (save){ save.disabled = false; save.textContent = "保存模型"; }
        if (revert) revert.disabled = false;
      }
    };
    el.addEventListener("change", handler);
    if (el.tagName === "INPUT" && el.type !== "checkbox" && el.type !== "number") el.addEventListener("input", handler);
  });

  const tk = document.getElementById("toggleKey");
  if (tk) tk.addEventListener("click", () => {
    const inp = document.getElementById("f-key");
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    tk.innerHTML = show ? I.eyeOff : I.eye;
    tk.setAttribute("aria-pressed", String(show));
  });

  const bt = document.getElementById("btnTest");
  if (bt) bt.addEventListener("click", () => testById(state.selectedId, bt));

  const bs = document.getElementById("btnSave");
  if (bs) bs.addEventListener("click", saveDraft);

  const br = document.getElementById("btnRevert");
  if (br) br.addEventListener("click", () => { state.draft = null; state.dirty = false; renderDetail(); toast("已放弃改动"); });
}

async function testById(id, btn){
  const m = MODELS.find(x => x.id === id); if (!m) return;
  if (btn){ btn.classList.add("spin"); btn.disabled = true; }
  state.testing = true;

  const slot = id === state.selectedId ? document.getElementById("testResult") : null;
  if (slot) slot.innerHTML = `<span class="result" style="color:var(--color-text-muted)">正在请求…</span>`;

  await new Promise(r => setTimeout(r, 900));   // 演示用；落地时替换为 llmModelAdminApi.testConnectionById

  const ok = (m.status ?? 1) === 1;
  const ms = 620 + Math.floor(Math.random() * 900);
  m.latencyMs = ms;
  m.lastTested = "刚刚";
  state.testing = false;

  if (btn){ btn.classList.remove("spin"); btn.disabled = false; }
  if (slot){
    slot.innerHTML = ok
      ? `<span class="result result-ok">${I.check}连接成功 · 延迟 ${ms} ms</span>`
      : `<span class="result result-err">模型已停用，无法建立连接</span>`;
  }
  renderList();
  if (!ok) toast(m.modelId + " 已停用，测试未通过", "err");
}

function saveDraft(){
  const m = current(); if (!m) return;
  const d = state.draft || m;

  if (!d.modelName?.trim() || !d.modelId?.trim()) return toast("模型标识与模型 ID 必填", "err");
  if (!d.baseUrl?.trim()) return toast("Base URL 必填", "err");
  if (!d.apiKey?.trim()) return toast("API Key 不能为空", "err");

  Object.assign(m, d);
  m.providerId = isCustomUrl(d.baseUrl) ? (d.providerId === "custom" ? "custom" : d.providerId) : "custom";
  state.draft = null; state.dirty = false;
  renderAll();
  toast("已保存「" + m.modelName + "」，下一轮对话生效");
}

function confirmDelete(id){
  const m = MODELS.find(x => x.id === id); if (!m) return;
  openModal(`
    <div class="modal-head">
      <span class="modal-title">删除模型</span>
      <button class="icon-btn" type="button" data-close aria-label="关闭">${I.x}</button>
    </div>
    <div class="modal-body">
      <p style="margin:0 0 10px">确认删除 <b>${esc(m.modelName)}</b>（#${m.id}）？</p>
      <div class="callout">${I.warn}<span>若没有其它模型共用该 API 凭据，凭据配置会一并删除。此操作不可撤销。</span></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" type="button" data-close>取消</button>
      <button class="btn btn-primary" type="button" id="doDelete" style="background:var(--color-danger)">删除</button>
    </div>`, () => {
      document.getElementById("doDelete").addEventListener("click", () => {
        MODELS = MODELS.filter(x => x.id !== id);
        if (state.selectedId === id) state.selectedId = MODELS[0]?.id ?? null;
        state.draft = null; state.dirty = false;
        closeModal(); renderAll(); toast("已删除");
      });
    });
}

/* ---------------------------------------------------------------
   新增模型弹窗
   --------------------------------------------------------------- */
function openAddModal(){
  const draft = { providerId:"deepseek", baseUrl:PROVIDERS[0].baseUrl, completionsPath:"/chat/completions",
                  embeddingsPath:"/embeddings", modelType:"openai", modelName:"", modelId:"", apiKey:"", supportsThinking:0, modelUsage:"default", contextWindow:null };

  openModal(`
    <div class="modal-head">
      <span class="modal-title">新增模型</span>
      <button class="icon-btn" type="button" data-close aria-label="关闭">${I.x}</button>
    </div>
    <div class="modal-body">
      <div class="grid">
        <div class="field col-2">
          <label class="field-label" for="a-provider">服务商</label>
          <div class="select-wrap">
            <select class="select" id="a-provider">
              ${PROVIDERS.map(x => `<option value="${x.id}">${esc(x.label)}</option>`).join("")}
            </select>${I.chev}
          </div>
        </div>
        <div class="field col-2">
          <label class="field-label" for="a-base">Base URL<span class="req" aria-hidden="true">*</span></label>
          <input class="input mono" id="a-base" value="${esc(draft.baseUrl)}" readonly />
        </div>
        <div class="field">
          <label class="field-label" for="a-name">模型标识（上游 model）<span class="req" aria-hidden="true">*</span></label>
          <input class="input mono" id="a-name" placeholder="与厂商文档逐字一致" />
        </div>
        <div class="field">
          <label class="field-label" for="a-id">模型 ID<span class="req" aria-hidden="true">*</span></label>
          <input class="input mono" id="a-id" placeholder="业务主键，对话可引用" />
          <span class="field-hint">留空则自动跟随模型标识</span>
        </div>
        <div class="field col-2">
          <label class="field-label" for="a-key">API Key<span class="req" aria-hidden="true">*</span></label>
          <input class="input mono" id="a-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field col-2">
          <label class="check">
            <input type="checkbox" id="a-fb" />
            <span>备用模型<span class="field-hint" style="display:block">主模型失败后按配置顺序尝试</span></span>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" type="button" data-close>取消</button>
      <button class="btn btn-primary" type="button" id="doCreate">创建</button>
    </div>`, () => {
      const sel = document.getElementById("a-provider");
      const base = document.getElementById("a-base");
      sel.addEventListener("change", () => {
        const p = providerOf(sel.value);
        base.value = p.baseUrl;
        base.readOnly = p.id !== "custom";
      });
      document.getElementById("doCreate").addEventListener("click", () => {
        const modelName = document.getElementById("a-name").value.trim();
        const modelId = document.getElementById("a-id").value.trim() || modelName;
        const apiKey = document.getElementById("a-key").value.trim();
        if (!modelName) return toast("模型标识必填", "err");
        if (!modelId) return toast("模型 ID 必填", "err");
        if (!apiKey) return toast("API Key 必填", "err");
        if (!base.value.trim()) return toast("Base URL 必填", "err");
        if (MODELS.some(m => m.modelId === modelId)) return toast("模型 ID 已存在：" + modelId, "err");

        MODELS.unshift({
          id: Math.max(0, ...MODELS.map(m => m.id)) + 1,
          modelId, modelName,
          providerId: providerOf(sel.value).id === "custom" || !providerOf(sel.value).baseUrl ? "custom" : sel.value,
          baseUrl: base.value.trim(),
          apiKey: maskKey(apiKey),
          completionsPath: "/chat/completions", embeddingsPath: "/embeddings",
          modelType: "openai",
          modelUsage: document.getElementById("a-fb").checked ? "fallback" : "default",
          supportsThinking: 0, contextWindow: null, status: 1,
          latencyMs: null, lastTested: "未测试"
        });
        state.selectedId = MODELS[0].id;
        state.filter = "all"; state.query = "";
        document.getElementById("search").value = "";
        closeModal(); renderSeg(); renderAll();
        toast("已新增模型，可直接在对话中选用");
      });
    });
}

/* ---------------------------------------------------------------
   Modal 基础设施
   --------------------------------------------------------------- */
let modalCleanup = null;
function openModal(html, onMount){
  const root = document.getElementById("modalRoot");
  const prev = document.activeElement;
  root.innerHTML = `<div class="scrim" role="dialog" aria-modal="true">${'<div class="modal">' + html + "</div>"}</div>`;
  const scrim = root.firstElementChild;
  scrim.addEventListener("mousedown", e => { if (e.target === scrim) closeModal(); });
  scrim.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
  const onKey = e => { if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", onKey);
  modalCleanup = () => { document.removeEventListener("keydown", onKey); if (prev && prev.focus) prev.focus(); };
  onMount?.();
  const first = scrim.querySelector("input,select,button");
  first?.focus();
}
function closeModal(){
  document.getElementById("modalRoot").innerHTML = "";
  modalCleanup?.(); modalCleanup = null;
}

/* ---------------------------------------------------------------
   Render / events
   --------------------------------------------------------------- */
function renderAll(){ renderList(); renderDetail(); updateSub(); }
function updateSub(){
  const on = MODELS.filter(m => (m.status ?? 1) === 1).length;
  document.getElementById("brandSub").textContent =
    `已接入 ${MODELS.length} 个模型 · ${on} 个已启用`;
}

document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; renderList(); });
document.getElementById("btnAdd").addEventListener("click", openAddModal);
document.getElementById("btnRefresh").addEventListener("click", () => {
  toast("已从 /api/v1/admin/ai-client-model/query-all 重新拉取");
  renderAll();
});
document.getElementById("btnImport").addEventListener("click", () =>
  toast("导入：解析 JSON 后逐条调用 createApi + createModel"));
document.getElementById("btnSettings").addEventListener("click", () =>
  toast("模型服务设置：默认模型、备用顺序、超时与重试"));

renderSeg();
renderAll();
</script>
