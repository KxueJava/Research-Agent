<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轨道巡逻 · 离线演示</title>
<style>*{box-sizing:border-box}body{margin:0;background:#deded3;color:#243225;font:14px system-ui;display:grid;place-items:center;min-height:100vh;padding:12px}.device{width:min(350px,100%);padding:18px 20px;background:#c6cbb1;border-radius:24px 24px 55px 24px;box-shadow:inset 0 0 0 2px #929b80,0 12px 30px #34432c20}header{display:flex;justify-content:space-between;font-weight:800;font-size:12px;letter-spacing:2px;margin:0 0 12px}.screen{background:#263b2c;border-radius:16px;padding:12px}canvas{display:block;width:100%;max-height:330px;aspect-ratio:280/360;background:#b7c56c;image-rendering:pixelated;outline:none;touch-action:none}.hud{display:flex;justify-content:space-between;color:#d8e1a0;font:12px monospace;padding-top:8px}.controls{display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px;gap:10px}button{cursor:pointer;touch-action:none;border:0;border-radius:12px;background:#334839;color:#e6edd7;padding:13px 17px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #18291d}#fire{background:#93435c;border-radius:50%;height:60px;width:60px;padding:0}.info{font-size:11px;color:#56634b;line-height:1.7;margin:12px 0 0}#phase{font-weight:700}button:focus-visible,canvas:focus-visible{outline:3px solid #a27032;outline-offset:2px}</style>
<main class="device"><header><span>ORBIT PATROL</span><span>01</span></header><div class="screen"><canvas id="screen" width="280" height="360" tabindex="0" aria-label="轨道巡逻游戏区域"></canvas><div class="hud"><span id="score">得分 0</span><span id="lives">生命 3</span><span id="position">位置 140</span></div></div><div class="controls"><div><button id="left" aria-label="左移">◀</button> <button id="right" aria-label="右移">▶</button></div><button id="start">开始</button><button id="fire" aria-label="射击">A</button></div><p class="info"><span id="phase">等待开始</span><br>方向键移动 · 空格射击 · 按钮支持触摸<br>合成演示数据，完全离线。失败后可重新开始。</p></main>
<script>const createGame=function createPatrolGame() {
  const state = { phase: 'ready', score: 0, lives: 3, player: { x: 140, y: 330 }, bullets: [], enemies: [], elapsed: 0, cooldown: 0, nextWave: 0 };
  const start = () => Object.assign(state, { phase: 'running', score: 0, lives: 3, player: { x: 140, y: 330 }, bullets: [], enemies: [{ x: 140, y: 100 }], elapsed: 0, cooldown: 0, nextWave: 2 });
  const step = (seconds, input = {}) => {
    if (state.phase !== 'running') return;
    const dt = Math.min(.1, Math.max(0, seconds)); state.elapsed += dt; state.cooldown -= dt;
    state.player.x = Math.max(12, Math.min(268, state.player.x + ((input.right ? 1 : 0) - (input.left ? 1 : 0)) * 150 * dt));
    if (input.fire && state.cooldown <= 0) { state.bullets.push({ x: state.player.x, y: state.player.y - 12 }); state.cooldown = .2; }
    if (state.elapsed >= state.nextWave) { state.enemies.push({ x: [140, 65, 215][Math.floor(state.elapsed / 2) % 3], y: 20 }); state.nextWave += 2; }
    state.bullets.forEach(b => b.y -= 220 * dt); state.enemies.forEach(e => e.y += 65 * dt);
    for (const enemy of state.enemies) {
      const bullet = state.bullets.find(b => !b.hit && Math.abs(b.x - enemy.x) < 14 && Math.abs(b.y - enemy.y) < 15);
      if (bullet) { bullet.hit = true; enemy.hit = true; state.score += 10; }
      else if (enemy.y > 350 || (Math.abs(enemy.y - state.player.y) < 16 && Math.abs(enemy.x - state.player.x) < 18)) { enemy.hit = true; state.lives = Math.max(0, state.lives - 1); }
    }
    state.bullets = state.bullets.filter(b => !b.hit && b.y > 0); state.enemies = state.enemies.filter(e => !e.hit);
    if (!state.lives) state.phase = 'over';
  };
  return { state, start, step };
};const game=createGame(),keys={left:false,right:false,fire:false},canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');let previous=performance.now();
function paint(){const s=game.state;ctx.fillStyle='#b7c56c';ctx.fillRect(0,0,280,360);ctx.fillStyle='#87974e';for(let i=0;i<32;i++){const x=(i*83)%280,y=(i*47+s.elapsed*12)%360;ctx.fillRect(x,y,2,2)}ctx.fillStyle='#263b2c';ctx.fillRect(s.player.x-9,s.player.y-4,18,10);ctx.fillRect(s.player.x-3,s.player.y-12,6,10);s.bullets.forEach(b=>ctx.fillRect(b.x-2,b.y-4,4,9));s.enemies.forEach(e=>{ctx.fillRect(e.x-9,e.y-7,18,14);ctx.fillStyle='#b7c56c';ctx.fillRect(e.x-5,e.y-3,3,3);ctx.fillRect(e.x+2,e.y-3,3,3);ctx.fillStyle='#263b2c'});if(s.phase!=='running'){ctx.textAlign='center';ctx.font='bold 21px monospace';ctx.fillText(s.phase==='over'?'GAME OVER':'ORBIT PATROL',140,170)}document.getElementById('score').textContent='得分 '+s.score;document.getElementById('lives').textContent='生命 '+s.lives;document.getElementById('position').textContent='位置 '+Math.round(s.player.x);document.getElementById('phase').textContent=s.phase==='over'?'任务结束，点击重新开始':s.phase==='running'?'巡逻中':'等待开始';document.getElementById('start').textContent=s.phase==='ready'?'开始':'重新开始'}
function loop(now){game.step(Math.min(.05,(now-previous)/1000),keys);previous=now;paint();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('start').onclick=()=>{game.start();paint();canvas.focus()};
for(const [id,key] of [['left','left'],['right','right'],['fire','fire']]){const button=document.getElementById(id);button.onpointerdown=e=>{e.preventDefault();keys[key]=true;button.setPointerCapture(e.pointerId);game.step(.05,keys);paint()};button.onpointerup=button.onpointercancel=()=>{keys[key]=false};button.onclick=()=>{game.step(.05,{[key]:true});paint()}}
window.addEventListener('keydown',e=>{const key={ArrowLeft:'left',ArrowRight:'right',' ':'fire'}[e.key];if(key){e.preventDefault();keys[key]=true;game.step(.05,keys);paint()}});window.addEventListener('keyup',e=>{const key={ArrowLeft:'left',ArrowRight:'right',' ':'fire'}[e.key];if(key){e.preventDefault();keys[key]=false}});window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));paint();</script></html>
