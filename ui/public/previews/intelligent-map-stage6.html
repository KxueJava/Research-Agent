function note(message){$('#assistant-note').textContent=message;$('#assistant-note').classList.remove('hidden')}
function svg(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,String(v));parent.append(el);return el}
function calc(ids,mode){let total=0,minutes=0;const legs=[];for(let i=1;i<ids.length;i++){const a=place(ids[i-1]),b=place(ids[i]);const distance=Math.round(Math.hypot(a[5]-b[5],a[6]-b[6])*5.5/10)*10;const duration=Math.round(distance/(mode==='cycling'?190:69));legs.push({from:a[0],to:b[0],distance,duration});total+=distance;minutes+=duration;}return {ids:[...ids],mode,legs,distance:total,duration:minutes,at:Date.now()};}
function pathData(ids){return ids.map((id,i)=>{const p=place(id);if(!i)return `M ${p[5]} ${p[6]}`;const a=place(ids[i-1]),x=a[5]+(p[5]-a[5])*.53,y=a[6]+(p[6]-a[6])*.36;return `L ${x} ${a[6]} Q ${x+15} ${a[6]} ${x+15} ${y} L ${x+15} ${p[6]} L ${p[5]} ${p[6]}`;}).join(' ')}
function camera(){const {x,y,z}=state.view;$('#camera').setAttribute('transform',`translate(${x} ${y}) translate(460 215) scale(${z}) translate(-460 -215)`)}
function select(id,focusMap=true){selected=id;state.selected=id;const p=place(id);if(focusMap){state.view.x=(460-p[5])*state.view.z;state.view.y=(215-p[6])*state.view.z;camera();}renderSelection();save();const card=[...document.querySelectorAll('.place-card')].find(n=>n.dataset.id===id);card?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'nearest',inline:'nearest'});}
function renderSelection(){document.querySelectorAll('.marker,.place-card').forEach(n=>{n.classList.toggle('selected',n.dataset.id===selected);n.setAttribute('aria-pressed',n.dataset.id===selected?'true':'false')});const p=place(selected);$('#place-popup').replaceChildren();if(p){const title=document.createElement('strong');title.textContent=p[1];const body=document.createElement('div');body.textContent=p[3]+' · '+p[2];$('#place-popup').append(title,body)}}
function renderMap(){const group=$('#route-layer'),markers=$('#marker-layer');group.replaceChildren();markers.replaceChildren();if(route){const d=pathData(route.ids);svg('path',{d,class:'route-under'},group);svg('path',{d,class:'route-line'+(pending||!sameRoute()?' pending':'')},group);}state.ids.forEach((id,i)=>{const p=place(id);const g=svg('g',{class:'marker','data-id':id,transform:`translate(${p[5]} ${p[6]})`,tabindex:0,role:'button','aria-label':`选择地点 ${i+1} ${p[1]}`},markers);svg('circle',{r:15,fill:'#397d58',stroke:'#fff','stroke-width':3},g);const text=svg('text',{'text-anchor':'middle',y:4,fill:'#fff'},g);text.textContent=i+1;const label=svg('text',{class:'place-name','text-anchor':'middle',y:32},g);label.textContent=p[1];g.onclick=()=>select(id);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id)}}});camera();renderSelection()}
function sameRoute(){return route&&route.mode===state.mode&&JSON.stringify(route.ids)===JSON.stringify(state.ids)}
function status(text,type=''){const el=$('#route-status');el.className='route-state '+type;el.replaceChildren();const icon=document.createElement('span');icon.textContent=pending?'◌':type==='error'?'!':'●';if(pending)icon.className='spinner';el.append(icon,document.createTextNode(text))}
function renderCards(){const list=$('#itinerary');list.replaceChildren();state.ids.forEach((id,i)=>{const p=place(id),card=document.createElement('article');card.className='place-card';card.dataset.id=id;card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',`选择 ${p[1]}`);const leg=sameRoute()?route.legs[i-1]:null;card.innerHTML=`<div class="card-top"><span class="number">${i+1}</span><span class="small muted">${i?'停留地点':'起点'}</span></div><h3></h3><div class="address"></div><div class="leg"></div><div class="card-actions"><button data-op="up" aria-label="上移${p[1]}" ${i===0?'disabled':''}>↑ 上移</button><button data-op="down" aria-label="下移${p[1]}" ${i===state.ids.length-1?'disabled':''}>↓</button><button data-op="replace">替换</button><button data-op="remove" aria-label="删除${p[1]}" ${state.ids.length<=2?'disabled':''}>删除</button></div>`;card.querySelector('h3').textContent=p[1];card.querySelector('.address').textContent=p[2];card.querySelector('.leg').textContent=i===0?'从这里开始':leg?`${state.mode==='walking'?'步行':'骑行'} ${leg.duration} 分钟 · ${(leg.distance/1000).toFixed(1)} 公里`:'路线待更新';card.onclick=e=>{const op=e.target.closest('[data-op]')?.dataset.op;if(!op){select(id);return}e.stopPropagation();if(op==='replace'){openPicker(id);return}if(op==='remove'){state.ids=state.ids.filter(x=>x!==id);if(selected===id)selected=state.ids[0];updateRoute('已删除地点，正在更新路线');return}const to=i+(op==='up'?-1:1);if(to>=0&&to<state.ids.length){[state.ids[i],state.ids[to]]=[state.ids[to],state.ids[i]];updateRoute('已调整顺序，正在更新路线')}};card.onkeydown=e=>{if(e.target===card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(id)}};list.append(card)});renderSelection()}
function render(){const c=catalog[state.city];$('#city').value=state.city;$('#mode').value=state.mode;$('#user-prompt').textContent=c.prompt;$('#reply').textContent=c.reply;$('#trip-title').textContent=c.title;$('#water-label').textContent=c.water;$('#map-stage').classList.toggle('dark',state.theme==='dark');document.querySelectorAll('.city-tab').forEach(b=>b.classList.toggle('active',b.dataset.city===state.city));const valid=sameRoute();$('#metrics').textContent=`${state.mode==='walking'?'步行':'骑行'}行程　·　${state.ids.length-1} 个停留点 + 起点　·　${valid?route.duration+' 分钟行进 / '+(route.distance/1000).toFixed(1)+' 公里':'距离与耗时待更新'}`;renderMap();renderCards();}
function updateRoute(message='正在更新路线',delay=850){const request=++version;pending=true;const shouldFail=failNext;failNext=false;const ids=[...state.ids],mode=state.mode;render();status(message+'，保留上一条有效路线','warn');$('#retry').classList.add('hidden');save();setTimeout(()=>{if(request!==version)return;pending=false;if(shouldFail){render();status('更新失败 · 虚线为上一条路线，未作为新行程结果','error');$('#retry').classList.remove('hidden');save();note('路线服务暂时不可用。已保留修改后的地点和上一条有效路线，可点击“重试更新”。');return}route=calc(ids,mode);render();status('路线已更新 · '+new Date(route.at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · 模拟结果');save();},delay)}
function switchCity(city){if(!catalog[city])return;version++;pending=false;state=defaults(city);selected=state.selected;route=calc(state.ids,state.mode);$('#retry').classList.add('hidden');$('#assistant-note').classList.add('hidden');render();status('已切换城市示例 · 模拟结果');save();notify('已切换行程，地图组件保持在当前页面')}
function openPicker(id=null){replaceId=id;lastFocus=document.activeElement;$('#picker-title').textContent=id?'替换 '+place(id)[1]:'添加地点';$('#place-search').value='';$('#picker').classList.remove('hidden');renderCandidates();$('#place-search').focus()}
function closePicker(){if($('#picker').classList.contains('hidden'))return;$('#picker').classList.add('hidden');lastFocus?.focus()}
function renderCandidates(){const query=$('#place-search').value.trim();const list=$('#candidates');list.replaceChildren();const options=catalog[state.city].places.filter(p=>!state.ids.includes(p[0])&&(!query||(p[1]+p[2]+p[3]).includes(query)));if(!options.length){const el=document.createElement('p');el.textContent='没有匹配的示例地点。可尝试“公园”或清空搜索。';list.append(el)}for(const p of options){const b=document.createElement('button');b.className='candidate';const info=document.createElement('span'),title=document.createElement('strong'),sub=document.createElement('small');title.textContent=p[1];sub.textContent=p[2]+' · '+p[3];info.append(title,sub);const arrow=document.createElement('span');arrow.textContent='＋';b.append(info,arrow);b.onclick=()=>{if(replaceId){const i=state.ids.indexOf(replaceId);if(i>=0)state.ids[i]=p[0];}else state.ids.push(p[0]);selected=p[0];closePicker();updateRoute('地点已调整，正在更新路线');note('已'+(replaceId?'替换为':'添加')+'「'+p[1]+'」。行程顺序和受影响路线将同步更新。')};list.append(b)}}
function fullscreen(open){const active=document.body.classList.contains('fullscreen');if(open===active)return;document.body.classList.toggle('fullscreen',open);document.body.style.overflow=open?'hidden':'';$('#expand').textContent=open?'× 返回对话':'⤢ 展开地图';$('#expand').setAttribute('aria-expanded',String(open));if(open){lastFocus=document.activeElement;$('#expand').focus()}else lastFocus?.focus();camera();save()}
function speak(text){$('#chat-input').value='';if(/杭州/.test(text)){switchCity('hangzhou');note('已切换杭州示例，使用同一张地图组件展示新的行程。');return}if(/厦门/.test(text)){switchCity('xiamen');return}if(/骑行|步行/.test(text)){state.mode=/骑行/.test(text)?'cycling':'walking';updateRoute('交通方式已修改，正在更新路线');note('已改为'+(state.mode==='cycling'?'骑行':'步行')+'，路线和预计行进时间将同步更新。');return}if(/删除|去掉/.test(text)){const p=catalog[state.city].places.find(p=>state.ids.includes(p[0])&&text.includes(p[1]));const id=p?.[0]||state.ids[1];if(state.ids.length<=2){note('请至少保留起点和一个目的地。');return}state.ids=state.ids.filter(x=>x!==id);if(selected===id)selected=state.ids[0];updateRoute();note('已删除「'+place(id)[1]+'」，其余地点保持原有顺序。');return}if(/换|替/.test(text)){const target=catalog[state.city].places.find(p=>!state.ids.includes(p[0])&&text.includes(p[1]));if(target){state.ids[1]=target[0];selected=target[0];updateRoute();note('已将第二站替换为「'+target[1]+'」。');}else{openPicker(state.ids[1]);note('请从候选地点中选择第二站的替代地点。')}return}if(/增加|添加|再加/.test(text)){openPicker();note('选择要增加的地点；加入后会保留已有顺序并更新路线。');return}if(/全屏|展开/.test(text)){fullscreen(true);return}if(/少走|优化|重排/.test(text)){note('这个原型支持手动排序。请用地点卡片的上移/下移按钮调整；不会把未实现的路线优化当作已完成。');return}note('原型可演示：替换第二站、增加/删除地点、切换步行或骑行、切换厦门/杭州、展开地图。真实阶段六将由 Agent 解析更广泛的请求。')}
$('#expand').onclick=()=>fullscreen(!document.body.classList.contains('fullscreen'));$('#map-nav').onclick=()=>fullscreen(true);$('#city').onchange=e=>switchCity(e.target.value);document.querySelectorAll('.city-tab').forEach(b=>b.onclick=()=>switchCity(b.dataset.city));$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';render();save()};$('#mode').onchange=e=>{state.mode=e.target.value;updateRoute('正在按新的交通方式更新路线')};$('#add-place').onclick=()=>openPicker();$('#close-picker').onclick=closePicker;$('#place-search').oninput=renderCandidates;$('#picker').onclick=e=>{if(e.target===$('#picker'))closePicker()};$('#replan').onclick=()=>updateRoute('正在重新查询当前顺序的路线');$('#retry').onclick=()=>updateRoute('正在重试路线更新');$('#zoom-in').onclick=()=>zoom(1.2);$('#zoom-out').onclick=()=>zoom(1/1.2);$('#fit').onclick=()=>{state.view={x:0,y:0,z:1};camera();save()};function zoom(f){state.view.z=Math.max(.6,Math.min(2.6,state.view.z*f));camera();save()}
$('#map').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?.94:1.06)},{passive:false});$('#map').addEventListener('pointerdown',e=>{if(e.target.closest('.marker'))return;drag={x:e.clientX,y:e.clientY,vx:state.view.x,vy:state.view.y};$('#map').setPointerCapture(e.pointerId)});$('#map').addEventListener('pointermove',e=>{if(!drag)return;const rect=$('#map').getBoundingClientRect(),factor=Math.max(920/rect.width,430/rect.height);state.view.x=drag.vx+(e.clientX-drag.x)*factor;state.view.y=drag.vy+(e.clientY-drag.y)*factor;camera()});$('#map').addEventListener('pointerup',()=>{if(drag){drag=null;save()}});$('#map').addEventListener('pointercancel',()=>{drag=null});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#picker').classList.contains('hidden'))closePicker();else fullscreen(false)}if(e.key==='Tab'&&!$('#picker').classList.contains('hidden')){const items=[...$('#picker').querySelectorAll('input,button')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}else if(e.key==='Tab'&&document.body.classList.contains('fullscreen')){const items=[...document.querySelector('.map-surface').querySelectorAll('button:not(:disabled),select,[tabindex="0"]')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});$('#chat').onsubmit=e=>{e.preventDefault();const text=$('#chat-input').value.trim();if(text)speak(text)};document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));$('#fail-next').onclick=()=>{failNext=true;notify('下一次更新将模拟失败，可先替换或删除一个地点')};$('#race').onclick=()=>{state.mode='cycling';updateRoute('第一次修改：骑行',1700);state.mode='walking';updateRoute('最新修改：步行',500);note('先提交骑行，再提交步行；旧骑行请求较晚返回，但不会覆盖最新步行结果。')};$('#restore').onclick=()=>location.reload();$('#reset').onclick=()=>switchCity(state.city);$('#new-chat').onclick=()=>{switchCity('xiamen');$('#chat-input').focus();notify('已开启新的示例行程')};$('#share').onclick=()=>{const lines=[catalog[state.city].title,'交互原型 · 模拟数据（非真实导航）',...state.ids.map((id,i)=>`${i+1}. ${place(id)[1]} — ${place(id)[2]}`),sameRoute()?`模拟总距离 ${(route.distance/1000).toFixed(1)} 公里，行进约 ${route.duration} 分钟`:'路线尚未更新，请勿按旧路线出行'];const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='行程预览.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出行程预览，包含模拟数据标识')};
selected=state.ids.includes(state.selected)?state.selected:state.ids[0];
const restored=state.route;if(restored&&Array.isArray(restored.ids)&&restored.ids.every(id=>place(id))&&Array.isArray(restored.legs)&&Number.isFinite(restored.at))route=restored;else route=calc(state.ids,state.mode);delete state.route;render();if(sameRoute())status('已恢复行程 · '+new Date(route.at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · 模拟结果');else{status('已恢复地点修改 · 旧路线待更新','warn');$('#retry').classList.remove('hidden')}save();
})();
</script></body></html>
