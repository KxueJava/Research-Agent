<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composer Reasoning Control</title>
<style>
:root{color-scheme:light;--page:#f4f6f7;--surface:#fff;--surface-soft:#f7f8f9;--ink:#1d252a;--muted:#78838a;--line:#e1e6e9;--accent:#356bd2;--ultra:#a855f7;--track:#e0e4e7;--thumb:#fff;--shadow:0 18px 50px rgb(25 35 42/.12)}
:root.dark{color-scheme:dark;--page:#101112;--surface:#232526;--surface-soft:#2b2d2f;--ink:#f1f3f4;--muted:#a2a9ad;--line:#3b3e40;--accent:#527fe2;--ultra:#c084fc;--track:#414345;--thumb:#fafafa;--shadow:0 22px 65px rgb(0 0 0/.42)}
*{box-sizing:border-box}body{min-width:320px;min-height:100dvh;margin:0;display:grid;place-items:center;background:var(--page);color:var(--ink);font-family:"Geist Variable","Inter","Segoe UI",system-ui,sans-serif;transition:background .2s,color .2s}button,input{font:inherit}button{cursor:pointer}.stage{width:min(100%,900px);padding:32px 20px}.stage-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.stage-label{margin:0;color:var(--accent);font:600 11px/1.2 ui-monospace,SFMono-Regular,monospace;letter-spacing:.14em;text-transform:uppercase}.theme-button{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}.theme-button:before{content:"☼";font-size:18px}:root.dark .theme-button:before{content:"☾"}.composer{width:min(100%,760px);margin:0 auto;padding:17px 18px 13px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.prompt{min-height:128px;padding:3px 2px 22px;color:var(--ink);font-size:16px;line-height:1.65}.prompt span{color:var(--muted)}.composer-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)}.toolbar{display:flex;align-items:center;gap:6px;min-width:0}.tool{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);white-space:nowrap}.tool:hover,.tool.open{border-color:var(--line);background:var(--surface-soft)}.model-mark{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#68768d;color:#fff;font-size:10px;font-weight:700}.chevron{width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px)}.effort-chip{color:var(--accent);font-size:12px;font-weight:700}.effort-trigger{position:relative}.popover{position:absolute;z-index:5;left:0;bottom:calc(100% + 12px);width:300px;padding:14px 14px 15px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(5px);transition:opacity .16s,transform .16s}.effort-trigger.open .popover{opacity:1;pointer-events:auto;transform:translateY(0)}.popover-head{display:flex;align-items:center;justify-content:flex-end;margin-bottom:14px}.popover-title{color:var(--ink);font-size:13px;font-weight:650}.reset{display:grid;place-items:center;width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:var(--muted)}.reset:hover{background:var(--surface-soft);color:var(--ink)}.reset-icon{width:15px;height:15px;border:1.6px solid currentColor;border-left-color:transparent;border-radius:50%}.slider-track{position:relative;height:32px;border-radius:999px;background:var(--track);overflow:hidden}.fill{position:absolute;inset:0 auto 0 0;width:25%;border-radius:inherit;background:var(--accent);transition:width .16s}.slider{position:absolute;z-index:2;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}.thumb{position:absolute;z-index:1;top:50%;left:25%;width:38px;height:38px;border-radius:50%;background:var(--thumb);box-shadow:0 2px 7px rgb(0 0 0/.28);transform:translate(-50%,-50%);pointer-events:none;transition:left .16s}.stops{position:absolute;z-index:1;inset:0 15px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.stop{width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--ink) 35%,transparent)}.stop.active{background:color-mix(in srgb,var(--accent) 70%,white)}.slider:focus-visible+.thumb{outline:2px solid var(--accent);outline-offset:3px}.level-row{display:flex;justify-content:space-between;align-items:center;margin-top:11px;font-size:12px}.level{color:var(--ink);font-weight:700}.level-note{color:var(--muted)}.send{width:34px;height:34px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:17px}.send span{display:inline-block;transform:rotate(-45deg)}@media(max-width:560px){.composer-footer{align-items:flex-end;flex-direction:column}.toolbar{width:100%;overflow-x:auto}.send{align-self:flex-end}.popover{width:280px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

.ultra .fill{background:linear-gradient(100deg,#493bd5 0%,#9150ed 38%,#cd6aff 64%,#7244db 100%);background-size:180% 100%;animation:ultra-flow 5s ease-in-out infinite}
.ultra .fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 8% 64%,#fff9 0 1px,transparent 2px),radial-gradient(circle at 17% 32%,#fff8 0 1.5px,transparent 2.5px),radial-gradient(circle at 34% 58%,#fffb 0 1px,transparent 2px),radial-gradient(circle at 47% 39%,#fffa 0 1.5px,transparent 2.5px),radial-gradient(circle at 62% 72%,#fff9 0 1px,transparent 2px),radial-gradient(circle at 75% 38%,#fffc 0 2px,transparent 3px),radial-gradient(circle at 87% 64%,#fff9 0 1px,transparent 2px);animation:ultra-stars 3.5s ease-in-out infinite}
.ultra .effort-chip,.ultra .level{color:#9337cf}
:root.dark .ultra .effort-chip,:root.dark .ultra .level{color:#c45bff}
.ultra .stop.active{background:#e6c7ff;box-shadow:0 0 5px #c45bff55}
.ultra .thumb{box-shadow:0 0 0 2px #b86cff25,0 2px 10px #0003}
.ultra .slider:focus-visible+.thumb{outline-color:#b45cf1}
@keyframes ultra-flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes ultra-stars{0%,100%{opacity:.45;transform:translateX(-2px)}50%{opacity:1;transform:translateX(3px)}}
@media(prefers-reduced-motion:reduce){.ultra .fill,.ultra .fill::after{animation:none}}

</style></head><body><main class="stage"><div class="stage-top"><p class="stage-label">Composer / model controls</p><button class="theme-button" id="themeButton" type="button" aria-label="Toggle theme"></button></div><section class="composer" aria-label="Message composer"><div class="prompt">Research will complete your task, then shape the answer around the result.<br><span>Model settings stay close to the input so they are easy to adjust before sending.</span></div><footer class="composer-footer"><div class="toolbar"><button class="tool" type="button"><span class="model-mark">M</span><span>gpt-5.6-luna</span><span class="chevron"></span></button><div class="effort-trigger" id="effortTrigger"><button class="tool" id="effortButton" type="button" aria-expanded="false" aria-haspopup="dialog"><span class="effort-chip" id="effortChip">medium</span><span class="chevron"></span></button><div class="popover" role="dialog" aria-label="Reasoning effort"><div class="popover-head"><button class="reset" id="resetButton" type="button" aria-label="Reset reasoning effort"><span class="reset-icon"></span></button></div><div class="slider-track"><div class="fill" id="fill"></div><div class="stops" aria-hidden="true"><i class="stop active"></i><i class="stop active"></i><i class="stop"></i><i class="stop"></i><i class="stop"></i></div><input class="slider" id="slider" type="range" min="0" max="4" value="1" step="1" aria-label="Reasoning effort level"><span class="thumb" id="thumb"></span></div><div class="level-row"><span class="level" id="level">medium</span></div></div></div></div><button class="send" type="button" aria-label="Send"><span>➤</span></button></footer></section></main><script>
const levels=['low','medium','high','max','Ultra'],slider=document.getElementById('slider'),fill=document.getElementById('fill'),thumb=document.getElementById('thumb'),level=document.getElementById('level'),chip=document.getElementById('effortChip'),stops=[...document.querySelectorAll('.stop')],trigger=document.getElementById('effortTrigger'),button=document.getElementById('effortButton');function update(){const index=Number(slider.value),ratio=index/(levels.length-1),value=levels[index];fill.style.width=`${ratio*100}%`;thumb.style.left=`${ratio*100}%`;level.textContent=value;chip.textContent=value;document.body.classList.toggle('ultra',value==='Ultra');stops.forEach((stop,i)=>stop.classList.toggle('active',i<=index))}slider.addEventListener('input',update);document.getElementById('resetButton').addEventListener('click',()=>{slider.value=1;update()});button.addEventListener('click',()=>{const open=trigger.classList.toggle('open');button.setAttribute('aria-expanded',String(open))});document.getElementById('themeButton').addEventListener('click',()=>document.documentElement.classList.toggle('dark'));document.addEventListener('click',event=>{if(!trigger.contains(event.target)){trigger.classList.remove('open');button.setAttribute('aria-expanded','false')}});update();
</script></body></html>
